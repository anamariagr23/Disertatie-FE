<app-navbar></app-navbar>
<div class="form-container">
    <div class="form-header">Create Dorm Admin</div>

    <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()" #adminForm="ngForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" [(ngModel)]="adminEmail" required class="form-control">
        </div>
        <div class="form-group">
            <label for="dorm">Dorm:</label>
            <select id="dorm" name="dorm" [(ngModel)]="selectedDormId" required class="form-control">
                <option [ngValue]="null" disabled selected>Select a dorm</option>
                <option *ngFor="let dorm of dorms" [ngValue]="dorm.id">{{ dorm.name }}</option>
            </select>
        </div>
        <button type="submit" [disabled]="!adminForm.valid">Create Dorm Admin</button>
    </form>
</div>

<div class="form-container">
    <div class="form-header">Existing Dorm Admins</div>
    <table class="admins-table" *ngIf="dormAdmins.length > 0">
        <thead>
            <tr><th>Email</th><th>Dorm(s)</th><th></th></tr>
        </thead>
        <tbody>
            <tr *ngFor="let admin of dormAdmins">
                <td>{{ admin.email }}</td>
                <td>{{ admin.dorms.length > 0 ? admin.dorms.join(', ') : 'None assigned' }}</td>
                <td>
                    <button type="button" class="reset-button" [disabled]="isResetting === admin.id"
                        (click)="resetPassword(admin)">
                        {{ isResetting === admin.id ? 'Resetting...' : 'Reset Password' }}
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
    <p *ngIf="dormAdmins.length === 0" class="no-admins">No dorm admins created yet.</p>
</div>
